aid: greenspark
name: Greenspark
description: >-
  Greenspark is an Impact-as-a-Service platform that lets businesses embed
  climate and environmental action into their products and customer journeys.
  Its Climate API programmatically funds verified impacts — carbon offset,
  tree planting, ocean-plastic recovery, kelp restoration, clean water and bee
  protection — and provides carbon-footprint estimation (by Merchant Category
  Code or Open Banking category), impact reporting, email/notification templates,
  and embeddable impact widgets for storefronts. Authentication is a single
  x-api-key header with separate sandbox, demo and production environments.
  Greenspark ships six first-party TypeScript SDKs, a ReadMe-hosted MCP server,
  and packaged Agent Skills. Backed by Anthemis; profiled and enriched by the
  API Evangelist network.
