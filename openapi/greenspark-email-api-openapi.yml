          items:
            type: string
        template:
          type: object
          description: The type of the template.
          example: invitation
        trigger:
          description: Choose the impact action which triggers your email to be sent out.
          example: '["offsetPerOrder", "offsetPerProduct"]'
          type: array
          items:
            type: string
      required:
      - isScheduleCustom
      - isTriggerCustom
      - name
      - schedule
      - template
      - trigger
