components:
  schemas:
    ImpactPurchaseWithPrice:
      type: object
      properties:
        type:
          type: string
          enum:
          - trees
          - carbon
          - plastic
          - kelp
          - water
          - bees
          description: Type of the impact.
          example: trees
        projectId:
          type: string
          description: The id of the project.
          example: 34d41293-6b84-40e7-9744-122e301590a2
        amount:
          type: number
          description: Amount means number of trees, number of plastic bottles, kg of CO2.
          example: 5
        price:
          type: number
          example: 0.55
          description: Amount of money spent on the impact purchase.
        purchaseIds:
          example:
          - id1
          - id2
          description: The ids of the purchases what are made to for the impact.
          type: array
          items:
            type: string
      required:
      - type
      - amount
      - price
      - purchaseIds
    ImpactPurchase:
      type: object
      properties:
        type:
          type: string
          enum:
          - trees
          - carbon
          - plastic
          - kelp
          - water
          - bees
          description: Type of the impact.
          example: trees
        projectId:
          type: string
          description: The id of the project.
          example: 34d41293-6b84-40e7-9744-122e301590a2
        amount:
          type: number
          description: Amount means number of trees, number of plastic bottles, kg of CO2.
          example: 5
      required:
      - type
      - amount
    RawReportRow:
      type: object
      properties:
        createdAt:
          type: string
          example: '2022-09-09 09:12:54.162+00'
          description: Creation date of the impact.
        totalPrice:
          type: number
          example: 1
          description: Total amount of money spent on the impact.
        currency:
          type: string
          example: dollar
          description: The currency of the spent money on the impact.
        sourceName:
          type: string
          example: source1
          description: The name of the source associated with the impact.
        sourceId:
          type: string
          example: 631b035dcd13c4ad66c6d496
          description: The id of the source associated with the impact.
        triggerName:
          type: string
          example: trigger1
          description: The name of the trigger associated with the impact.
        triggerId:
          type: string
          example: 631b035dcd13c4ad66c6d497
          description: The id of the trigger associated with the impact.
        impactPurchases:
          description: The impactPurchases array contains your spending on a specific purpose.
          type: array
          items:
            $ref: '#/components/schemas/ImpactPurchase'
        metadata:
          description: In the metadata array you can store up to 10 key-value pairs. You can use them to associate arbitrary data with your impact.
          type: array
          items:
            $ref: '#/components/schemas/Metadata'
      required:
      - createdAt
      - totalPrice
      - currency
      - sourceName
      - sourceId
      - triggerName
      - triggerId
      - impactPurchases
      - metadata
    Metadata:
      type: object
      properties:
        key:
          type: string
          description: Minimum 1, maximum 40 characters.
          example: customerId
        value:
          type: string
          description: Minimum 1, maximum 100 characters.
          example: 743ce227-22ef-4c6e-9c06-725f97b99690
      required:
      - key
      - value
    RawReport:
      type: object
      properties:
        rows:
          example:
          - createdAt: '2022-09-09 09:12:54.162+00'
            totalPrice: 1
            currency: dollar
            sourceName: source1
            sourceId: 631b035dcd13c4ad66c6d496
            triggerName: trigger1
            triggerId: 631b035dcd13c4ad66c6d497
            impactPurchases:
            - type: trees
              amount: 5
              price: 1
            - type: carbon
              amount: 5
              price: 0.05
            metadata:
            - key: key1
