                  properties:
                    type:
                      type: string
                      description: The type of the spending.
                    amount:
                      type: number
                      description: The amount of the spending.
                    month:
                      type: string
                      description: The month when your impacts were created.
                example:
                - type: carbon
                  amount: 5
                  month: 2022-09
