      - transactionId
      - impactPurchases
    BatchImpactPurchaseResponses:
      type: object
      properties:
        responses:
          description: The responses array contains the results of the batch impact purchases.
          type: array
          items:
            $ref: '#/components/schemas/BatchImpactPurchaseResponse'
      required:
      - responses
    RawReportRow:
      type: object
