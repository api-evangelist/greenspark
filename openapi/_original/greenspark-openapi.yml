          - carbon
          - plastic
          - kelp
          - water
          - bees
          description: Type of the impact.
          example: trees
        projectId:
          type: string
          description: The id of the project.
          example: 34d41293-6b84-40e7-9744-122e301590a2
        amount:
          type: number
          description: Amount means number of trees, number of plastic bottles, kg of CO2.
          example: 5
