          example: '2023-02-08T13:26:33.969Z'
        endDate:
          format: date-time
          type: string
          description: The end date of the scheduled email sending.
          example: '2023-03-08T13:26:33.969Z'
      required:
      - startDate
      - endDate
    SettingsRequestBody:
      type: object
